<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

    <!--Set visual viewport size for mobile devices to the device size,
        witch results in a scale of 1 and a 1:1 mapping between CSS pixels
        and Qt device independent pixels. -->
    <meta name="viewport" content="width=device-width, height=device-height, user-scalable=0"/>

    <title>sqlite_visual_editor</title>
    <style>
      /* Make the html body cover the entire (visual) viewport with no scroll bars. */
      html, body { padding: 0; margin: 0; overflow: hidden; height: 100% }
      #screen { width: 100%; height: 100%; }

      /* Пловечки текстов бројач кој ќе се гледа преку Canvas-от */
      #floating-counter {
        position: fixed;
        bottom: 12px;
        right: 12px;
        z-index: 999999;
        background: #2b2b2b;
        color: #e0e0e0;
        border: 1px solid #444;
        font-family: monospace, sans-serif;
        font-size: 12px;
        padding: 4px 10px;
        border-radius: 4px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.6);
        pointer-events: none;
      }
      #visitor-count {
        color: #00ea90;
        font-weight: bold;
      }
    </style>
  </head>
  <body onload="init()">
    <figure style="overflow:visible;" id="qtspinner">
      <center style="margin-top:1.5em; line-height:150%">
        <img src="qtlogo.svg" width="320" height="200" style="display:block"></img>
        <strong>Qt for WebAssembly: sqlite_visual_editor</strong>
        <div id="qtstatus"></div>
        <noscript>JavaScript is disabled. Please enable JavaScript to use this application.</noscript>
      </center>
    </figure>
    <div id="screen"></div>

    <!-- Чист Текстов Бројач (без слики) -->
    <div id="floating-counter">
      Visitors: <span id="visitor-count">...</span>
    </div>

    <script type="text/javascript">
        // Се повикува API-то за зголемување на бројот на посети
        fetch('https://api.countapi.xyz/hit/srdzank.github.io-sqliteWeb/visits')
          .then(res => res.json())
          .then(data => {
            document.getElementById('visitor-count').innerText = data.value;
          })
          .catch(() => {
            document.getElementById('visitor-count').innerText = '1+';
          });

        async function init()
        {
            const spinner = document.querySelector('#qtspinner');
            const screen = document.querySelector('#screen');
            const status = document.querySelector('#qtstatus');

            const showUi = (ui) => {
                [spinner, screen].forEach(element => element.style.display = 'none');
                if (screen === ui)
                    screen.style.position = 'default';
                ui.style.display = 'block';
            }

            try {
                showUi(spinner);
                status.innerHTML = 'Loading...';

                const instance = await qtLoad({
                    qt: {
                        onLoaded: () => showUi(screen),
                        onExit: exitData =>
                        {
                            status.innerHTML = 'Application exit';
                            status.innerHTML +=
                                exitData.code !== undefined ? ` with code ${exitData.code}` : '';
                            status.innerHTML +=
                                exitData.text !== undefined ? ` (${exitData.text})` : '';
                            showUi(spinner);
                        },
                        entryFunction: window.sqlite_visual_editor_entry,
                        containerElements: [screen],
                        
                    }
                });
            } catch (e) {
                console.error(e);
                console.error(e.stack);
            }
        }
    </script>
    <script src="sqlite_visual_editor.js"></script>
    <script type="text/javascript" src="qtloader.js"></script>
  </body>
</html>
